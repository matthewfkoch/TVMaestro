name: TestFlight

on:
  workflow_dispatch:
    inputs:
      companion_only:
        description: Upload only the iOS companion
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  testflight:
    name: Apple TV TestFlight
    if: github.event_name != 'workflow_dispatch' || inputs.companion_only != true
    runs-on: macos-15
    defaults:
      run:
        working-directory: appletv
    steps:
      - uses: actions/checkout@v4

      - name: Check TestFlight secrets
        id: asc
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$ASC_KEY_ID" || -z "$ASC_ISSUER_ID" || -z "$ASC_PRIVATE_KEY" || -z "$APPLE_TEAM_ID" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TestFlight secrets are not configured; skipping upload"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ruby/setup-ruby@v1
        if: steps.asc.outputs.enabled == 'true'
        with:
          ruby-version: "3.1"
          bundler-cache: true
          working-directory: appletv

      - name: Install Fastlane
        if: steps.asc.outputs.enabled == 'true'
        run: bundle install

      - name: Configure App Store Connect API key
        if: steps.asc.outputs.enabled == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          echo "ASC_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Select Xcode
        if: steps.asc.outputs.enabled == 'true'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Upload to TestFlight
        if: steps.asc.outputs.enabled == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bundle exec fastlane beta

  companion:
    name: Companion TestFlight
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check TestFlight secrets
        id: asc
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$ASC_KEY_ID" || -z "$ASC_ISSUER_ID" || -z "$ASC_PRIVATE_KEY" || -z "$APPLE_TEAM_ID" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TestFlight secrets are not configured; skipping upload"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode
        if: steps.asc.outputs.enabled == 'true'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - uses: actions/setup-node@v4
        if: steps.asc.outputs.enabled == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Sync iOS web assets
        if: steps.asc.outputs.enabled == 'true'
        working-directory: mobile
        run: |
          npm ci
          npx cap sync ios

      - name: Fetch Capacitor frameworks
        if: steps.asc.outputs.enabled == 'true'
        run: |
          chmod +x scripts/build-mobile.sh
          scripts/build-mobile.sh --prepare-ios-only
          xattr -cr mobile/ios mobile/www || true

      - uses: ruby/setup-ruby@v1
        if: steps.asc.outputs.enabled == 'true'
        with:
          ruby-version: "3.1"
          bundler-cache: true
          working-directory: appletv

      - name: Install Fastlane
        if: steps.asc.outputs.enabled == 'true'
        working-directory: appletv
        run: bundle install

      - name: Configure App Store Connect API key
        if: steps.asc.outputs.enabled == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          echo "ASC_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Upload companion to TestFlight
        if: steps.asc.outputs.enabled == 'true'
        timeout-minutes: 40
        working-directory: mobile
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/appletv/Gemfile
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: bundle exec fastlane ios beta
