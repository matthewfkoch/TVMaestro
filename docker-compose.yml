services:
  tvmaestro:
    # Always pull the published image. Local builds must pass --pull never.
    image: ghcr.io/matthewfkoch/tvmaestro:latest
    pull_policy: always
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: tvmaestro
    ports:
      - "6790:6790"
    volumes:
      - ./data:/data
      # Share host adb keys so container can power devices over network debugging
      - ${HOME}/.android:/root/.android:ro
    environment:
      - TVMAESTRO_PORT=6790
      - TVMAESTRO_DATA_DIR=/data
      - TVMAESTRO_LOG_LEVEL=INFO
    restart: unless-stopped
