<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1218" />
    <title>TVMaestro</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <img class="wordmark" src="wordmark.png" alt="TVMaestro" />
      <p class="lede">Connect to the TVMaestro server on your network. This app shows the same guide as the webpage.</p>
      <form id="form">
        <label for="host">Server address</label>
        <input
          id="host"
          name="host"
          type="text"
          inputmode="url"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          placeholder="192.168.1.20"
          required
        />
        <label for="port">Port</label>
        <input id="port" name="port" type="text" inputmode="numeric" autocomplete="off" value="6790" />
        <button id="submit" type="submit">Connect</button>
        <p id="message" role="status"></p>
      </form>
    </main>
    <script src="app.js"></script>
  </body>
</html>
