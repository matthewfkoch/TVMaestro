name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ruff (Python)
        uses: astral-sh/ruff-action@v3
        with:
          src: server
      - name: Shellcheck (scripts)
        run: shellcheck -S warning scripts/*.sh
      - name: Verify Fastlane bundle
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: appletv

  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Pytest
        run: pytest -q

  web:
    name: Web test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload web dist
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: false
          load: false
          tags: tvmaestro:ci
          cache-from: type=gha,scope=docker-ci
          cache-to: type=gha,mode=max,scope=docker-ci

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - uses: ./.github/actions/setup-android-sdk
        with:
          platform: "platforms;android-37.0"
          build-tools: "build-tools;36.0.0"
          platform-dir: "android-37.0"
      - name: Test & assemble debug
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  appletv:
    name: Apple TV
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/select-xcode
      - name: Core unit tests
        run: |
          chmod +x scripts/test-appletv-core.sh
          scripts/test-appletv-core.sh
      - name: Build for tvOS
        run: |
          chmod +x scripts/build-appletv.sh
          scripts/build-appletv.sh
      - name: Upload app bundle
        uses: actions/upload-artifact@v7
        with:
          name: appletv-app
          path: appletv/build/Build/Products/**/TVMaestro.app
          if-no-files-found: error

  companion-android:
    name: Companion Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            web/package-lock.json
      - uses: ./.github/actions/setup-android-sdk
        with:
          platform: "platforms;android-36"
          build-tools: "build-tools;35.0.0"
          platform-dir: "android-36"
      - name: Bundle guide, test, and sync assets
        run: |
          chmod +x scripts/bundle-companion-guide.sh
          scripts/bundle-companion-guide.sh
          cd mobile
          npm ci
          npm test
          npx cap sync android
      - name: Test & assemble debug
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: companion-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  companion-ios:
    name: Companion iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/select-xcode
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            web/package-lock.json
      - name: Bundle guide, test, and sync assets
        run: |
          chmod +x scripts/bundle-companion-guide.sh
          scripts/bundle-companion-guide.sh
          cd mobile
          npm ci
          npm test
          npx cap sync ios
      - name: Fetch Capacitor frameworks
        run: |
          chmod +x scripts/build-mobile.sh
          scripts/build-mobile.sh --prepare-ios-only
      - name: Build for iOS Simulator
        working-directory: mobile
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Upload app bundle
        uses: actions/upload-artifact@v7
        with:
          name: companion-ios-app
          path: mobile/ios/DerivedData/Build/Products/**/App.app
          if-no-files-found: error
