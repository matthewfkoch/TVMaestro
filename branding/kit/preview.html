<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TV Maestro logo kit</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      padding: 32px;
      font-family: "DM Sans", system-ui, sans-serif;
      background: #f3f5f8;
      color: #222931;
    }
    h1 { font-size: 1.4rem; font-weight: 650; margin: 0 0 0.3rem; }
    h2 { font-size: 0.95rem; font-weight: 650; margin: 1.6rem 0 0.6rem; }
    p { max-width: 46rem; color: #3c4652; line-height: 1.45; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch; }
    figure { margin: 0; }
    figcaption {
      margin-top: 6px;
      font: 11px/1.3 ui-monospace, monospace;
      color: #5c6773;
      word-break: break-all;
    }
    .swatch {
      padding: 18px 22px 12px;
      border-radius: 10px;
      min-width: 280px;
    }
    .light { background: #fff; border: 1px solid #e1e5eb; }
    .dark { background: #0e1218; }
    .dark figcaption { color: #8b9bb0; }
    .word img { height: 48px; width: auto; display: block; }
    .vector img { height: 88px; width: auto; display: block; }
    .mark img { height: 96px; width: auto; display: block; }
    .plate img {
      display: block;
      height: 140px;
      width: auto;
      background: #d5dbe3;
    }
    .plates { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; }
  </style>
</head>
<body>
  <h1>TV Maestro logo kit</h1>
  <p>
    Recolors of branding/logo-source.png. Canonical is the template:
    TV #2764AF, MAESTRO #222931. Each transparent lockup is shown on white
    and on the app background #0E1218.
  </p>
  <section><h2>canonical</h2><div class="row"><figure class="swatch light word"><img src="wordmark/canonical/h128.png" alt=""><figcaption>wordmark/canonical/h128.png</figcaption></figure><figure class="swatch dark word"><img src="wordmark/canonical/h128.png" alt=""><figcaption>wordmark/canonical/h128.png</figcaption></figure></div></section><section><h2>on-dark</h2><div class="row"><figure class="swatch light word"><img src="wordmark/on-dark/h128.png" alt=""><figcaption>wordmark/on-dark/h128.png</figcaption></figure><figure class="swatch dark word"><img src="wordmark/on-dark/h128.png" alt=""><figcaption>wordmark/on-dark/h128.png</figcaption></figure></div></section><section><h2>mono-dark</h2><div class="row"><figure class="swatch light word"><img src="wordmark/mono-dark/h128.png" alt=""><figcaption>wordmark/mono-dark/h128.png</figcaption></figure><figure class="swatch dark word"><img src="wordmark/mono-dark/h128.png" alt=""><figcaption>wordmark/mono-dark/h128.png</figcaption></figure></div></section><section><h2>mono-light</h2><div class="row"><figure class="swatch light word"><img src="wordmark/mono-light/h128.png" alt=""><figcaption>wordmark/mono-light/h128.png</figcaption></figure><figure class="swatch dark word"><img src="wordmark/mono-light/h128.png" alt=""><figcaption>wordmark/mono-light/h128.png</figcaption></figure></div></section><section><h2>mono-white</h2><div class="row"><figure class="swatch light word"><img src="wordmark/mono-white/h128.png" alt=""><figcaption>wordmark/mono-white/h128.png</figcaption></figure><figure class="swatch dark word"><img src="wordmark/mono-white/h128.png" alt=""><figcaption>wordmark/mono-white/h128.png</figcaption></figure></div></section>
  <h2>Vectors</h2>
  <div class="row"><figure class="swatch light vector"><img src="wordmark/canonical.svg" alt=""><figcaption>wordmark/canonical.svg</figcaption></figure><figure class="swatch dark vector"><img src="wordmark/canonical.svg" alt=""><figcaption>wordmark/canonical.svg</figcaption></figure><figure class="swatch light vector"><img src="wordmark/on-dark.svg" alt=""><figcaption>wordmark/on-dark.svg</figcaption></figure><figure class="swatch dark vector"><img src="wordmark/on-dark.svg" alt=""><figcaption>wordmark/on-dark.svg</figcaption></figure><figure class="swatch light vector"><img src="wordmark/mono-dark.svg" alt=""><figcaption>wordmark/mono-dark.svg</figcaption></figure><figure class="swatch dark vector"><img src="wordmark/mono-dark.svg" alt=""><figcaption>wordmark/mono-dark.svg</figcaption></figure><figure class="swatch light vector"><img src="wordmark/mono-light.svg" alt=""><figcaption>wordmark/mono-light.svg</figcaption></figure><figure class="swatch dark vector"><img src="wordmark/mono-light.svg" alt=""><figcaption>wordmark/mono-light.svg</figcaption></figure></div>
  <h2>TV mark</h2>
  <div class="row"><figure class="swatch light mark"><img src="mark/blue/s180.png" alt=""><figcaption>mark/blue/s180.png</figcaption></figure><figure class="swatch dark mark"><img src="mark/blue/s180.png" alt=""><figcaption>mark/blue/s180.png</figcaption></figure><figure class="swatch light mark"><img src="mark/charcoal/s180.png" alt=""><figcaption>mark/charcoal/s180.png</figcaption></figure><figure class="swatch dark mark"><img src="mark/charcoal/s180.png" alt=""><figcaption>mark/charcoal/s180.png</figcaption></figure><figure class="swatch light mark"><img src="mark/white/s180.png" alt=""><figcaption>mark/white/s180.png</figcaption></figure><figure class="swatch dark mark"><img src="mark/white/s180.png" alt=""><figcaption>mark/white/s180.png</figcaption></figure><figure class="swatch light mark"><img src="mark/blue.svg" alt=""><figcaption>mark/blue.svg</figcaption></figure><figure class="swatch dark mark"><img src="mark/blue.svg" alt=""><figcaption>mark/blue.svg</figcaption></figure></div>
  <h2>Plates</h2>
  <div class="plates"><figure class="plate"><img src="plate/icon-dark-512.png" alt=""><figcaption>plate/icon-dark-512.png</figcaption></figure><figure class="plate"><img src="plate/icon-light-512.png" alt=""><figcaption>plate/icon-light-512.png</figcaption></figure><figure class="plate"><img src="plate/icon-blue-512.png" alt=""><figcaption>plate/icon-blue-512.png</figcaption></figure><figure class="plate"><img src="plate/icon-dark-1024.png" alt=""><figcaption>plate/icon-dark-1024.png</figcaption></figure><figure class="plate"><img src="plate/banner-dark-640x360.png" alt=""><figcaption>plate/banner-dark-640x360.png</figcaption></figure><figure class="plate"><img src="plate/banner-dark-320x180.png" alt=""><figcaption>plate/banner-dark-320x180.png</figcaption></figure><figure class="plate"><img src="plate/banner-light-640x360.png" alt=""><figcaption>plate/banner-light-640x360.png</figcaption></figure></div>
</body>
</html>
