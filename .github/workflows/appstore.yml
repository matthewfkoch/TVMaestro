name: App Store

on:
  workflow_dispatch:
    inputs:
      platform:
        description: App to submit
        type: choice
        options:
          - tvos
          - ios
          - both
        default: tvos
      version:
        description: Marketing version, for example 0.4.3
        required: true
        type: string
      build_number:
        description: Processed TestFlight build number
        required: true
        type: string
      automatic_release:
        description: Release automatically when Apple approves
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tvos:
    name: Submit Apple TV
    if: inputs.platform == 'tvos' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: appletv
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-fastlane-asc
        with:
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          asc-private-key: ${{ secrets.ASC_PRIVATE_KEY }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          fail-if-missing: "true"

      - name: Submit for review
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          AUTOMATIC_RELEASE: ${{ inputs.automatic_release }}
        run: bundle exec fastlane submit

  ios:
    name: Submit companion
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-fastlane-asc
        with:
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          asc-private-key: ${{ secrets.ASC_PRIVATE_KEY }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          fail-if-missing: "true"

      - name: Submit for review
        working-directory: mobile
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/appletv/Gemfile
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          AUTOMATIC_RELEASE: ${{ inputs.automatic_release }}
        run: bundle exec fastlane ios submit
