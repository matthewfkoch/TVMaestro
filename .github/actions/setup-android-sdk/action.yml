name: Set up Android SDK
description: Configure ANDROID_HOME, accept SDK licenses, and install requested Android platform/build-tools.
inputs:
  platform:
    description: Android SDK platform package (e.g. platforms;android-36)
    required: true
  build-tools:
    description: Android SDK build-tools package (e.g. build-tools;35.0.0)
    required: true
  platform-dir:
    description: Expected directory name under $ANDROID_HOME/platforms (e.g. android-36)
    required: true

runs:
  using: composite
  steps:
    - name: Install Android SDK packages
      shell: bash
      env:
        SDK_PLATFORM: ${{ inputs.platform }}
        SDK_BUILD_TOOLS: ${{ inputs.build-tools }}
        SDK_PLATFORM_DIR: ${{ inputs.platform-dir }}
      run: |
        set -euo pipefail
        ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
        echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
        echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"

        SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
        if [[ ! -x "$SDKMANAGER" ]]; then
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)"
        fi
        if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
          echo "::error::sdkmanager not found under ${ANDROID_HOME}"
          exit 1
        fi

        yes | "$SDKMANAGER" --licenses >/dev/null || true
        "$SDKMANAGER" "$SDK_PLATFORM" "$SDK_BUILD_TOOLS"
        test -d "${ANDROID_HOME}/platforms/${SDK_PLATFORM_DIR}"
