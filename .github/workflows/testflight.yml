name: TestFlight

on:
  workflow_dispatch:
    inputs:
      companion_only:
        description: Upload only the iOS companion
        type: boolean
        default: false
  push:
    branches:
      - dev
    paths:
      - "appletv/**"
      - "mobile/**"
      - "web/**"
      - "scripts/bundle-companion-guide.sh"

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed Apple apps
    runs-on: ubuntu-latest
    outputs:
      appletv: ${{ steps.filter.outputs.appletv }}
      companion: ${{ steps.filter.outputs.companion }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute affected apps
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMPANION_ONLY: ${{ inputs.companion_only }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$COMPANION_ONLY" == "true" ]]; then
              echo "appletv=false" >> "$GITHUB_OUTPUT"
            else
              echo "appletv=true" >> "$GITHUB_OUTPUT"
            fi
            echo "companion=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "appletv=true" >> "$GITHUB_OUTPUT"
            echo "companion=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          if grep -qE '^appletv/' <<< "$changed"; then
            echo "appletv=true" >> "$GITHUB_OUTPUT"
          else
            echo "appletv=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^(mobile/|web/|scripts/bundle-companion-guide\.sh$)' <<< "$changed"; then
            echo "companion=true" >> "$GITHUB_OUTPUT"
          else
            echo "companion=false" >> "$GITHUB_OUTPUT"
          fi

  testflight:
    name: Apple TV TestFlight
    needs: [changes]
    if: needs.changes.outputs.appletv == 'true'
    runs-on: xcode-27
    defaults:
      run:
        working-directory: appletv
    steps:
      - uses: actions/checkout@v7

      - name: Set up Fastlane & App Store Connect
        id: asc
        uses: ./.github/actions/setup-fastlane-asc
        with:
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          asc-private-key: ${{ secrets.ASC_PRIVATE_KEY }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          fail-if-missing: "false"

      - uses: ./.github/actions/select-xcode
        if: steps.asc.outputs.enabled == 'true'

      - name: Upload to TestFlight
        if: steps.asc.outputs.enabled == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bundle exec fastlane beta

  companion:
    name: Companion TestFlight
    needs: [changes]
    if: needs.changes.outputs.companion == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up Fastlane & App Store Connect
        id: asc
        uses: ./.github/actions/setup-fastlane-asc
        with:
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          asc-private-key: ${{ secrets.ASC_PRIVATE_KEY }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          fail-if-missing: "false"

      - uses: ./.github/actions/select-xcode
        if: steps.asc.outputs.enabled == 'true'

      - uses: actions/setup-node@v7
        if: steps.asc.outputs.enabled == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            web/package-lock.json

      - name: Bundle guide and sync iOS assets
        if: steps.asc.outputs.enabled == 'true'
        run: |
          chmod +x scripts/bundle-companion-guide.sh
          scripts/bundle-companion-guide.sh
          cd mobile
          npm ci
          npx cap sync ios

      - name: Fetch Capacitor frameworks
        if: steps.asc.outputs.enabled == 'true'
        run: |
          chmod +x scripts/build-mobile.sh
          scripts/build-mobile.sh --prepare-ios-only
          xattr -cr mobile/ios mobile/www || true

      - name: Upload companion to TestFlight
        if: steps.asc.outputs.enabled == 'true'
        timeout-minutes: 40
        working-directory: mobile
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/appletv/Gemfile
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: bundle exec fastlane ios beta
